name: Java CI Combined

on: [push, pull_request, workflow_dispatch]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      publish: ${{ steps.publish.outputs.PUBLISH }}
    steps:
      # Only pushes and manual runs on master/main, a version branch (1.0, 2.0, ...) or release/* may
      # publish (deploy). Feature and PR branches only build and test.
      - name: Decide whether this run may publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          PUBLISH=false
          if [[ "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" ]]; then
            BRANCH="${REF#refs/heads/}"
            if [[ "$REF" == refs/heads/* ]] && [[ "$BRANCH" == "master" || "$BRANCH" == "main" || "$BRANCH" =~ ^[0-9]+(\.[0-9]+)*$ || "$BRANCH" == release/* ]]; then
              PUBLISH=true
            fi
          fi
          echo "event=${EVENT} ref=${REF} publish=${PUBLISH}"
          echo "PUBLISH=${PUBLISH}" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Extract version number
        id: extract-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "::set-output name=VERSION::$VERSION"

      - name: Cache Lucee files
        uses: actions/cache@v4
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  build-and-test:
    runs-on: ubuntu-latest
    needs: setup
    env:
      S3_ACCESS_KEY_ID: ${{ secrets.S3_AMAZON_ACCESS_KEY_ID }}
      S3_SECRET_KEY: ${{ secrets.S3_AMAZON_SECRET_KEY }}
      S3_BUCKET_PREFIX: lucee-ldev-e-
      S3_AMAZON_ACCESS_KEY_ID: ${{ secrets.S3_AMAZON_ACCESS_KEY_ID }}
      S3_AMAZON_SECRET_KEY: ${{ secrets.S3_AMAZON_SECRET_KEY }}
      S3_AMAZON_BUCKET_PREFIX: lucee-ldev-e-
      S3_CUSTOM_ACCESS_KEY_ID: "minioadmin"
      S3_CUSTOM_SECRET_KEY: "minioadmin"
      S3_CUSTOM_HOST: "localhost:9000"
      S3_CUSTOM_BUCKET_PREFIX: lucee-ldev-e-
      S3_BACKBLAZE_ACCESS_KEY_ID: 005a56c2ce399e70000000001
      S3_BACKBLAZE_SECRET_KEY: ${{ secrets.S3_BACKBLAZE_SECRET_KEY }}
      S3_BACKBLAZE_HOST: s3.us-east-005.backblazeb2.com
      S3_BACKBLAZE_BUCKET_PREFIX: lucee-ldev-e-
      S3_WASABI_ACCESS_KEY_ID: JM8VC29WSODA1DRT2H4Y
      S3_WASABI_SECRET_KEY: ${{ secrets.S3_WASABI_SECRET_KEY }}
      S3_WASABI_HOST: s3.eu-central-1.wasabisys.com
      S3_WASABI_BUCKET_PREFIX: lucee-ldev-e-
      S3_GOOGLE_ACCESS_KEY_ID: ${{ secrets.S3_GOOGLE_ACCESS_KEY_ID }}
      S3_GOOGLE_SECRET_KEY: ${{ secrets.S3_GOOGLE_SECRET_KEY }}
      S3_GOOGLE_HOST: storage.googleapis.com
      S3_GOOGLE_BUCKET_PREFIX: lucee-ldev-e-
      LUCEE_TEST_VERSIONS_PLUS: ${{ vars.LUCEE_TEST_VERSIONS_PLUS }}
    strategy:
      matrix:
        lucee: ${{ fromJSON(vars.LUCEE_TEST_VERSIONS_PLUS) }}
    services:
      minio:
        image: fclairamb/minio-github-actions
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Build and Install with Maven
        run: |
          echo "------- Maven Install -------";
          mvn -B -e -f pom.xml clean install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3-lex-${{ matrix.lucee.version }}
          path: target/*.lex

      - name: Checkout Lucee
        uses: actions/checkout@v4
        with:
          repository: lucee/lucee
          path: lucee

      # Lucee's bootstrap-tests.cfm has a hard 10 minute request timeout, so the suite is split over two
      # script-runner steps (each starts its own Lucee). testFilter is a comma separated list of strings that
      # must be contained in the spec path below the tests directory (tests/functions, tests/tickets, ...).
      # "extension" is the s3 labelled spec in the Lucee core test suite (test/extension/S3.cfc).
      # A new top level folder under tests/ must be added to one of the two filters, or it is not run.
      - name: Run Lucee Test Suite (functions)
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeVersionQuery: ${{ matrix.lucee.query }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: s3
          testAdditional: ${{ github.workspace }}/tests
          testFilter: functions

      # always run, so a failure in the first step does not hide the results of the second
      - name: Run Lucee Test Suite (tickets, general, vfs, core)
        if: ${{ !cancelled() }}
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeVersionQuery: ${{ matrix.lucee.query }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: s3
          testAdditional: ${{ github.workspace }}/tests
          testFilter: tickets,general,vfs,extension

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-and-test]
    # pull requests and feature branches only build and test
    if: always() && needs.build-and-test.result == 'success' && needs.setup.outputs.publish == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ubuntu-latest moved to Maven 3.10.0 (runner image 20261004). With it, central-publishing-maven-plugin
      # leaves maven-metadata-local.xml in the staging dir, which Central rejects ("Bundle has content that
      # does NOT have a .pom file"). Pin Maven 3.9.x like Lucee core and the other extensions.
      - name: Set up Maven 3.9.16
        run: |
          MVN_VERSION=3.9.16
          MVN_SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$MVN_VERSION/apache-maven-$MVN_VERSION-bin.tar.gz"
          echo "$MVN_SHA512  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin" >> $GITHUB_PATH
          "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin/mvn" -v

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build and Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot ${VERSION} on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy --settings maven-settings.xml
          elif [[ "$VERSION" =~ -(RC|BETA|ALPHA)$ ]]; then
            # pre-releases are not published to Maven Central, only to S3 (s3 job below)
            echo "------- Maven Install (signed) ${VERSION} on ${{ github.event_name }}, S3 only -------";
            mvn -B -e -f pom.xml clean install -DperformRelease=true --settings maven-settings.xml
          else
            echo "------- Maven Deploy release ${VERSION} on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy -DperformRelease=true --settings maven-settings.xml
          fi

      # everything the S3 upload needs (LDEV-6568): the .lex file plus the flattened POM
      - name: Upload artifact for S3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: s3-s3
          include-hidden-files: true
          path: |
            target/*.lex
            .flattened-pom.xml

  # upload the published build to the Maven folders (maven.lucee-services.com), LDEV-6568.
  # Cut-off rules (SNAPSHOTs stop on 2027-03-01) live in the called workflow.
  # Finals and SNAPSHOTs are also on Central / the snapshot repo; RC, BETA and ALPHA are only here.
  # secrets: inherit passes the org secrets S3_ACCESS_ID_DOWNLOAD and S3_SECRET_KEY_DOWNLOAD.
  # The called workflow warns and skips when those secrets are not available to this repo.
  s3:
    needs: [setup, deploy]
    if: always() && needs.deploy.result == 'success' && needs.setup.outputs.publish == 'true'
    uses: lucee/lucee/.github/workflows/extension-s3-upload.yml@7.1
    with:
      artifact-name: s3-s3
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit
